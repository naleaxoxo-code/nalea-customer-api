<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ocean Glass — Shop Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    width:460px; height:230px;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 15% 20%, #0891b2 0%, transparent 45%), radial-gradient(circle at 90% 85%, #0e7490 0%, transparent 45%), #021017;
    font-family:'Sora', sans-serif;
  }
  .card{
    position:relative;
    width:420px; height:194px;
    border-radius:22px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(103,232,249,0.35);
    backdrop-filter: blur(26px) saturate(200%) brightness(1.05);
    -webkit-backdrop-filter: blur(26px) saturate(200%) brightness(1.05);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
    display:flex; flex-direction:column; padding:18px 26px; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:0; left:-30%; width:45%; height:100%;
    background:linear-gradient(120deg, rgba(255,255,255,0.15), rgba(255,255,255,0) 60%);
    transform:skewX(-18deg); pointer-events:none;
  }
  .header{ display:flex; align-items:center; justify-content:space-between; }
  .loc{ font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#67e8f9; }
  .w-badge{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:#e0fbfc; }
  .center{ display:flex; align-items:baseline; gap:10px; }
  .clock{ font-family:'JetBrains Mono', monospace; font-weight:500; font-size:36px; color:#e0fbfc; margin-top:4px; }
  .tagline{ font-size:13px; font-weight:600; color:#67e8f9; }
  .footer{ margin-top:auto; display:flex; gap:10px; }
  .btn{
    flex:1; border:1px solid rgba(103,232,249,0.35); background:rgba(255,255,255,0.06);
    border-radius:14px; padding:9px 12px; display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:12px; font-weight:600; color:#e0fbfc; cursor:pointer; position:relative;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:#34d399; animation:pulse 2s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(52,211,153,0.5);} 70%{box-shadow:0 0 0 7px rgba(52,211,153,0);} 100%{box-shadow:0 0 0 0 rgba(52,211,153,0);} }
  .tooltip{
    position:absolute; bottom:110%; left:0; right:0; background:#083344; color:#fff;
    font-size:11px; padding:8px 10px; border-radius:10px; text-align:center;
    opacity:0; transform:translateY(6px); transition:all .25s ease; pointer-events:none;
  }
  .tooltip.show{ opacity:1; transform:translateY(0); }
  .track-panel{ max-height:0; opacity:0; overflow:hidden; transition:all .35s ease; }
  .track-panel.open{ max-height:50px; opacity:1; margin-top:8px; }
  .progress-track{ height:4px; border-radius:2px; background:rgba(103,232,249,0.2); overflow:hidden; }
  .progress-fill{ height:100%; width:70%; background:linear-gradient(90deg,#06b6d4,#34d399); }
  .progress-label{ font-size:10px; color:#67e8f9; margin-top:5px; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="loc" id="weather-location">📍 Locating…</div>
      <div class="w-badge"><span id="weather-icon">🌡️</span><span id="weather-temp">--°</span></div>
    </div>
    <div class="center">
      <div class="clock" id="clock-time">--:--:--</div>
      <div class="tagline">Enjoy Shopping</div>
    </div>
    <div class="track-panel" id="track-panel">
      <div class="progress-track"><div class="progress-fill"></div></div>
      <div class="progress-label">Order #48213 · Out for delivery</div>
    </div>
    <div class="footer">
      <button class="btn" id="chat-btn">
        <span class="dot"></span> Live Chat
        <span class="tooltip" id="chat-tooltip">Hi! How can we help?</span>
      </button>
      <button class="btn" id="track-btn">📦 Track Package</button>
    </div>
  </div>

<script>
function updateClock(){
  const now = new Date();
  let h = now.getHours();
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const ampm = h>=12?'PM':'AM';
  h = h%12; if(h===0) h=12;
  document.getElementById('clock-time').textContent = `${h}:${m}:${s} ${ampm}`;
}
setInterval(updateClock,1000); updateClock();

const weatherIcons = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️'};

function setWeatherError(){
  document.getElementById('weather-temp').textContent = '--°';
  document.getElementById('weather-location').textContent = '📍 Location off';
}

if('geolocation' in navigator){
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const {latitude, longitude} = pos.coords;
    try{
      const [weatherRes, geoRes] = await Promise.all([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&temperature_unit=celsius`),
        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`)
      ]);
      const weatherData = await weatherRes.json();
      const geoData = await geoRes.json();
      const temp = Math.round(weatherData.current_weather.temperature);
      const code = weatherData.current_weather.weathercode;
      document.getElementById('weather-icon').textContent = weatherIcons[code] || '🌡️';
      document.getElementById('weather-temp').textContent = `${temp}°C`;
      document.getElementById('weather-location').textContent = '📍 ' + (geoData.city || geoData.locality || geoData.principalSubdivision || 'Your area');
    }catch(e){ setWeatherError(); }
  }, ()=>{ setWeatherError(); }, {timeout:8000});
} else {
  setWeatherError();
}

const chatBtn = document.getElementById('chat-btn');
const chatTip = document.getElementById('chat-tooltip');
chatBtn.addEventListener('click', ()=>{
  chatTip.classList.toggle('show');
  setTimeout(()=>chatTip.classList.remove('show'), 4000);
});

const trackBtn = document.getElementById('track-btn');
const trackPanel = document.getElementById('track-panel');
trackBtn.addEventListener('click', ()=>{
  trackPanel.classList.toggle('open');
});
</script>
</body>
</html>
