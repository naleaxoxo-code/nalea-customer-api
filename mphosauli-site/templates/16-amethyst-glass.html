<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amethyst Glass — Shop Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    width:460px; height:220px;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 15% 30%, #7c3aed 0%, transparent 45%), radial-gradient(circle at 90% 70%, #db2777 0%, transparent 45%), #0d0620;
    font-family:'Outfit', sans-serif;
  }
  .card{
    position:relative;
    width:420px; height:184px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(216,180,254,0.4);
    backdrop-filter: blur(24px) saturate(200%) brightness(1.05);
    -webkit-backdrop-filter: blur(24px) saturate(200%) brightness(1.05);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
    display:flex; align-items:center; padding:0 26px; gap:22px; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:0; left:-30%; width:45%; height:100%;
    background:linear-gradient(120deg, rgba(255,255,255,0.15), rgba(255,255,255,0) 60%);
    transform:skewX(-18deg); pointer-events:none;
  }
  .col1{ display:flex; flex-direction:column; }
  .loc{ font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#e9d5ff; }
  .clock{ font-family:'JetBrains Mono', monospace; font-weight:500; font-size:32px; color:#faf5ff; margin-top:4px; }
  .weather{ display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; color:#e9d5ff; }
  .divider{ width:1px; height:110px; background:linear-gradient(180deg, transparent, rgba(216,180,254,0.35), transparent); }
  .col2{ display:flex; flex-direction:column; gap:8px; flex:1; }
  .tagline{ font-size:14px; font-weight:700; color:#faf5ff; }
  .tagline span{ color:#f0abfc; }
  .row{ display:flex; gap:8px; }
  .btn{
    flex:1; border:1px solid rgba(216,180,254,0.35); background:rgba(255,255,255,0.06);
    border-radius:12px; padding:8px 10px; font-size:11px; font-weight:600; color:#faf5ff;
    display:flex; align-items:center; gap:6px; cursor:pointer; position:relative;
  }
  .dot{ width:6px; height:6px; border-radius:50%; background:#4ade80; animation:pulse 2s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(74,222,128,0.5);} 70%{box-shadow:0 0 0 6px rgba(74,222,128,0);} 100%{box-shadow:0 0 0 0 rgba(74,222,128,0);} }
  .tooltip{
    position:absolute; bottom:110%; left:0; right:0; background:#4c1d95; color:#fff;
    font-size:10px; padding:7px 9px; border-radius:9px; text-align:center;
    opacity:0; transform:translateY(6px); transition:all .25s ease; pointer-events:none;
  }
  .tooltip.show{ opacity:1; transform:translateY(0); }
  .track-panel{ max-height:0; opacity:0; overflow:hidden; transition:all .35s ease; }
  .track-panel.open{ max-height:50px; opacity:1; margin-top:2px; }
  .progress-track{ height:4px; border-radius:2px; background:rgba(216,180,254,0.2); overflow:hidden; }
  .progress-fill{ height:100%; width:70%; background:linear-gradient(90deg,#c084fc,#f0abfc); }
  .progress-label{ font-size:9px; color:#e9d5ff; margin-top:4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="col1">
      <div class="loc" id="weather-location">📍 Locating…</div>
      <div class="clock" id="clock-time">--:--:--</div>
      <div class="weather"><span id="weather-icon">🌡️</span><span id="weather-temp">--°</span></div>
    </div>
    <div class="divider"></div>
    <div class="col2">
      <div class="tagline">Enjoy <span>Shopping</span></div>
      <div class="row">
        <button class="btn" id="chat-btn">
          <span class="dot"></span> Live Chat
          <span class="tooltip" id="chat-tooltip">Hi! How can we help?</span>
        </button>
        <button class="btn" id="track-btn">📦 Track</button>
      </div>
      <div class="track-panel" id="track-panel">
        <div class="progress-track"><div class="progress-fill"></div></div>
        <div class="progress-label">Order #48213 · Out for delivery</div>
      </div>
    </div>
  </div>

<script>
function updateClock(){
  const now = new Date();
  let h = now.getHours();
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const ampm = h>=12?'PM':'AM';
  h = h%12; if(h===0) h=12;
  document.getElementById('clock-time').textContent = `${h}:${m}:${s} ${ampm}`;
}
setInterval(updateClock,1000); updateClock();

const weatherIcons = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️'};

function setWeatherError(){
  document.getElementById('weather-temp').textContent = '--°';
  document.getElementById('weather-location').textContent = '📍 Location off';
}

if('geolocation' in navigator){
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const {latitude, longitude} = pos.coords;
    try{
      const [weatherRes, geoRes] = await Promise.all([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&temperature_unit=celsius`),
        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`)
      ]);
      const weatherData = await weatherRes.json();
      const geoData = await geoRes.json();
      const temp = Math.round(weatherData.current_weather.temperature);
      const code = weatherData.current_weather.weathercode;
      document.getElementById('weather-icon').textContent = weatherIcons[code] || '🌡️';
      document.getElementById('weather-temp').textContent = `${temp}°C`;
      document.getElementById('weather-location').textContent = '📍 ' + (geoData.city || geoData.locality || geoData.principalSubdivision || 'Your area');
    }catch(e){ setWeatherError(); }
  }, ()=>{ setWeatherError(); }, {timeout:8000});
} else {
  setWeatherError();
}

const chatBtn = document.getElementById('chat-btn');
const chatTip = document.getElementById('chat-tooltip');
chatBtn.addEventListener('click', ()=>{
  chatTip.classList.toggle('show');
  setTimeout(()=>chatTip.classList.remove('show'), 4000);
});

const trackBtn = document.getElementById('track-btn');
const trackPanel = document.getElementById('track-panel');
trackBtn.addEventListener('click', ()=>{
  trackPanel.classList.toggle('open');
});
</script>
</body>
</html>
