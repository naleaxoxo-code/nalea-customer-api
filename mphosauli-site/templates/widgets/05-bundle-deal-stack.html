<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>05 — Bundle Deal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --plum:#150a18; --gold:#e3bd7d; --rose:#e6a4b4; --champagne:#f3e3cf; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; overflow:hidden; position:relative;
    background:radial-gradient(circle at 70% 20%, #2a1530 0%, #150a18 55%, #0a050b 100%); }
  .glow{ position:absolute; width:400px; height:400px; border-radius:50%; background:var(--gold); filter:blur(90px); opacity:.25; top:-100px; right:-100px; }

  .popup{ position:relative; z-index:5; width:420px; max-width:92vw; background:rgba(255,255,255,0.06);
    backdrop-filter:blur(26px) saturate(160%); -webkit-backdrop-filter:blur(26px) saturate(160%);
    border:1px solid rgba(255,255,255,0.14); border-radius:26px; box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,0.08);
    padding:32px 28px 30px; text-align:center; color:#fff; animation:rise .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise{ from{opacity:0; transform:translateY(28px);} to{opacity:1; transform:translateY(0);} }

  .close{ position:absolute; top:14px; right:16px; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15); cursor:pointer; display:flex; align-items:center; justify-content:center; color:#cbb; font-size:13px; transition:.25s; z-index:20; }
  .close:hover{ background:rgba(255,255,255,0.18); transform:rotate(90deg); }

  h1{ font-family:'Playfair Display',serif; font-weight:700; font-size:22px; margin-bottom:4px; }
  h1 .accent{ background:linear-gradient(120deg,var(--gold),var(--rose)); -webkit-background-clip:text; background-clip:text; color:transparent; font-style:italic; }
  p.sub{ font-size:12px; color:#cdb9c4; margin-bottom:22px; font-weight:300; }

  .stack{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .item{ display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    border-radius:14px; padding:10px 14px; text-align:left; opacity:0; transform:translateX(-16px); animation:slide-item .5s forwards; }
  .item:nth-child(1){ animation-delay:.1s; }
  .item:nth-child(2){ animation-delay:.25s; }
  .item:nth-child(3){ animation-delay:.4s; }
  @keyframes slide-item{ to{ opacity:1; transform:translateX(0);} }
  .item-icon{ width:46px; height:46px; border-radius:10px; background:linear-gradient(135deg,var(--rose),var(--gold)); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
  .item-name{ font-size:12.5px; font-weight:500; color:var(--champagne); flex:1; }
  .item-price{ font-size:12px; color:#a896a0; }
  .plus{ text-align:center; color:#a896a0; font-size:14px; margin:-4px 0; }

  .total-row{ display:flex; justify-content:space-between; align-items:baseline; padding:14px 4px; border-top:1px dashed rgba(255,255,255,0.15); margin-bottom:18px; }
  .total-label{ font-size:12px; color:#cdb9c4; }
  .total-price{ font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:var(--gold); }
  .total-old{ font-size:12px; color:#7a6a76; text-decoration:line-through; margin-right:6px; }

  button.cta{ width:100%; padding:15px 20px; border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(120deg,var(--gold),#f4d999 60%, var(--rose)); background-size:200% 100%;
    color:#1d1020; font-weight:700; font-size:14px; box-shadow:0 14px 30px rgba(227,189,125,.25); transition:.3s; }
  button.cta:hover{ background-position:100% 0; transform:translateY(-2px); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="popup">
    <button class="close" onclick="this.closest('.popup').style.display='none'">✕</button>
    <h1>The <span class="accent">Glow Bundle</span></h1>
    <p class="sub">3 best-sellers, bundled to save you 22%</p>

    <div class="stack">
      <div class="item"><div class="item-icon">💅</div><div class="item-name">Bling Girl Nail Kit</div><div class="item-price">R 699</div></div>
      <div class="plus">+</div>
      <div class="item"><div class="item-icon">✨</div><div class="item-name">Forehead Patches 6-Pack</div><div class="item-price">R 99</div></div>
      <div class="plus">+</div>
      <div class="item"><div class="item-icon">💋</div><div class="item-name">V.V. Love Fragrance Set</div><div class="item-price">R 239</div></div>
    </div>

    <div class="total-row">
      <span class="total-label">Bundle Total</span>
      <span><span class="total-old">R 1,037</span><span class="total-price">R 809</span></span>
    </div>

    <button class="cta">Add Bundle To Bag</button>
  </div>
</body>
</html>
