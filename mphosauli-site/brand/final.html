<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#050507;width:1600px;font-family:Inter,system-ui,sans-serif;color:#eee}
.g{display:grid;gap:24px;padding:24px}
.big{border-radius:28px;overflow:hidden;background:radial-gradient(50% 70% at 15% 30%,rgba(255,77,141,.28),transparent),radial-gradient(50% 70% at 85% 70%,rgba(109,93,252,.28),transparent),#050507;border:1px solid #1d1d22;display:grid;place-items:center;height:520px}
.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}
.card{border-radius:24px;display:grid;place-items:center;height:360px;overflow:hidden;border:1px solid #1d1d22}
.lt{background:#f4f1ec}.pk{background:linear-gradient(135deg,#ff2d7a,#6d5dfc)}
img{display:block}
.sm{display:flex;gap:28px;align-items:center;justify-content:center}
.lab{font-size:12px;letter-spacing:.3em;color:#ff4d8d;padding:30px 24px 0}
</style></head><body>
<div class="lab">MAIN LOGO</div>
<div class="g"><div class="big"><img src="logo/mpho-sauli-logo-dark.svg" width="1200"></div></div>
<div class="g two"><div class="card lt"><img src="logo/mpho-sauli-logo-light.svg" width="680"></div><div class="card pk"><img src="logo/mpho-sauli-logo-mono.svg" width="680"></div></div>
<div class="lab">ICON · FACE BADGE · SMALL SIZES</div>
<div class="g three"><div class="card" style="background:#0b0b10"><img src="logo/mpho-sauli-icon.svg" width="280"></div>
<div class="card" style="background:#0b0b10"><img src="logo/mpho-sauli-face-badge.svg" width="320"></div>
<div class="card" style="background:#0b0b10"><div class="sm"><img src="logo/mpho-sauli-icon.svg" width="96"><img src="logo/mpho-sauli-icon.svg" width="48"><img src="logo/mpho-sauli-icon.svg" width="24"><img src="logo/mpho-sauli-face-badge.svg" width="110"><img src="logo/mpho-sauli-face-badge.svg" width="48"></div></div></div>
</body></html>
